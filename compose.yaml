# Local backend stack: Go backend (with TeX Live + sandbox in its image), compiling
# in-process under bubblewrap. `--profile split` additionally starts the
# standalone compiler service (production topology) on 127.0.0.1:8081; point a
# server at it with COMPILER_URL=http://127.0.0.1:8081 COMPILER_AUTH=bearer
# COMPILER_TOKEN=dev-compiler-token.
# The Next.js frontend runs on the host (`npm run dev` in apps/web) and talks
# to the backend at http://127.0.0.1:8080. Supabase (auth + Postgres) and R2
# are external services — fill backend/.env from the *.env.example template.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    environment:
      PORT: "8080"
    # bubblewrap (per-compile sandbox) needs unprivileged user namespaces;
    # Docker's default seccomp profile blocks them, so lift the filter.
    # systempaths=unconfined unmasks /proc so bwrap can mount a fresh procfs
    # in its namespace. The container (Docker VM) plus bwrap per compile
    # remain the isolation layers for untrusted .tex input.
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    # TeX compilation is CPU-heavy; give it room.
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Production-shaped compiler service, for testing the split locally. Mirrors
  # the Cloud Run hardening: read-only root, no capabilities, no new privileges,
  # one job at a time, memory-capped. (Egress is not blocked here; in
  # production it is, via the VPC — see docs/compiler-service.md.)
  compiler:
    profiles: ["split"]
    build:
      context: ./backend
      dockerfile: Dockerfile.compiler
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      PORT: "8080"
      COMPILER_TOKEN: "${COMPILER_TOKEN:-dev-compiler-token}"
      MAX_PARALLEL_COMPILES: "1"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
